<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - Atharv's Drawing Board</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="form-box" id="login-box">
            <h2>Welcome Back 👋</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="auth-btn">Login</button>
                <div class="divider">OR</div>
                <button type="button" class="auth-btn google-btn">Continue with Google</button>
                <p class="error-msg" id="login-error"></p>
            </form>
            <p class="switch-form">Don't have an account? <span id="go-to-signup">Sign up here</span></p>
        </div>

        <div class="form-box hidden" id="signup-box">
            <h2>Create Account 🎨</h2>
            <form id="signup-form">
                <div class="input-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required placeholder="Create a password">
                </div>
                <button type="submit" class="auth-btn">Sign Up</button>
                <div class="divider">OR</div>
                <button type="button" class="auth-btn google-btn">Continue with Google</button>
                <p class="error-msg" id="signup-error"></p>
            </form>
            <p class="switch-form">Already have an account? <span id="go-to-login">Login here</span></p>
        </div>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
