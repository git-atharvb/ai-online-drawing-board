<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atharv's Online Drawing Board</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" title="Toggle Theme">🌙</button>

    <!-- Animated Ambient Background Shapes -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>
    
    <!-- Loading Spinner Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Authenticating...</p>
    </div>

    <div class="auth-container">
        <img src="logo.png" alt="App Logo" class="auth-logo">
        <div class="form-box" id="login-box">
            <h2> Online Drawing Board</h2>
            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="login-email" required placeholder=" ">
                    <label for="login-email">Email Address</label>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" required placeholder=" ">
                    <label for="login-password">Password</label>
                </div>
                <button type="submit" class="auth-btn">Login</button>
                <div class="divider">OR</div>
                <button type="button" class="auth-btn google-btn">
                    <svg xmlns="http://www.width.com/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20C44 22.659 43.862 21.35 43.611 20.083z"/>
                        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-0.792 2.237-2.231 4.166-4.087 5.571c0.001-0.001 0.002-0.001 0.003-0.002l6.19 5.238C36.971 39.205 44 34 44 24C44 22.659 43.862 21.35 43.611 20.083z"/>
                    </svg>
                    Continue with Google
                </button>
                <p class="error-msg" id="login-error"></p>
            </form>
            <p class="switch-form">Don't have an account? <span id="go-to-signup">Sign up here</span></p>
        </div>

        <div class="form-box hidden" id="signup-box">
            <h2>Create Account ✨</h2>
            <form id="signup-form">
                <div class="input-group">
                    <input type="email" id="signup-email" required placeholder=" ">
                    <label for="signup-email">Email Address</label>
                </div>
                <div class="input-group">
                    <input type="password" id="signup-password" required placeholder=" ">
                    <label for="signup-password">Create a Password</label>
                </div>
                <button type="submit" class="auth-btn">Sign Up</button>
                <div class="divider">OR</div>
                <button type="button" class="auth-btn google-btn">
                    <svg xmlns="http://www.width.com/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20C44 22.659 43.862 21.35 43.611 20.083z"/>
                        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-0.792 2.237-2.231 4.166-4.087 5.571c0.001-0.001 0.002-0.001 0.003-0.002l6.19 5.238C36.971 39.205 44 34 44 24C44 22.659 43.862 21.35 43.611 20.083z"/>
                    </svg>
                    Continue with Google
                </button>
                <p class="error-msg" id="signup-error"></p>
            </form>
            <p class="switch-form">Already have an account? <span id="go-to-login">Login here</span></p>
        </div>
    </div>
    <footer>
        &copy; Programmed & Managed by <a href="https://www.linkedin.com/in/ananya-parbat/" target="_blank" style="color: inherit; text-decoration: underline;">Ananya</a> & <a href="https://www.linkedin.com/in/abowlekar/" target="_blank" style="color: inherit; text-decoration: underline;">Atharv</a> - Sept 2025
    </footer>
    <script type="module" src="auth.js"></script>
</body>
</html>
