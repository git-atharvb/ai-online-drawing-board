<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery - Atharv's Drawing Board</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="gallery.js" defer></script>
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <button id="theme-toggle" class="gallery-theme-toggle" title="Toggle Theme">🌙</button>

    <!-- Loading Spinner Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Loading your masterpieces...</p>
    </div>

    <div class="header-branding">
        <div class="brand">
            <img src="logo.png" alt="Logo" class="header-logo">
            My Cloud Gallery ☁️
        </div>
        <div class="tagline">View and manage your saved artworks</div>
    </div>
    
    <div class="gallery-controls">
        <a href="index.html" class="back-btn">⬅️ Back to Drawing Board</a>
    </div>

    <div class="gallery-container" id="gallery-container">
    </div>

    <!-- Full Screen Image Modal -->
    <div id="image-modal" class="modal">
        <span class="modal-close" id="modal-close">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <footer>
        &copy; Programmed & Managed by <a href="https://www.linkedin.com/in/ananya-parbat/" target="_blank" style="color: inherit; text-decoration: underline;">Ananya</a> & <a href="https://www.linkedin.com/in/abowlekar/" target="_blank" style="color: inherit; text-decoration: underline;">Atharv</a> - Sept 2025
    </footer>
</body>
</html>
